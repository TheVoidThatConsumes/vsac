[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vsac"
version = "0.3.0"
description = "Venom-Sac — dependency risk scanner for the Gossamer Suite (CVE, slopsquatting, SBOM; digest tier not yet implemented)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "TheVoidThatConsumes" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.0",
]

[project.scripts]
vsac = "vsac.cli:main"

[tool.setuptools.packages.find]
include = ["vsac*"]
exclude = ["tests*"]